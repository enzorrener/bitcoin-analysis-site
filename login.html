<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar | CryptoAnalysis</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #f5f5f5;
            --secondary: #a1a1a1;
            --accent: #f7931a;
            --border: #2a2a2a;
            --danger: #ef4444;
            --gradient-primary: linear-gradient(135deg, #f7931a 0%, #ffb84d 100%);
            --gradient-bg: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--gradient-bg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            color: var(--primary);
            -webkit-font-smoothing: antialiased;
        }

        .login-card {
            background: rgba(26, 26, 26, 0.95);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 48px 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 24px 48px rgba(0, 0, 0, 0.5);
            animation: cardFadeIn 0.4s ease;
        }

        @keyframes cardFadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .login-brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 32px;
        }

        .brand-icon {
            width: 40px;
            height: 40px;
            background: var(--gradient-primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
            font-weight: 700;
            box-shadow: var(--shadow);
        }

        .brand-text {
            color: var(--accent);
            font-size: 20px;
            font-weight: 700;
        }

        .login-title {
            color: var(--primary);
            font-size: 24px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 8px;
        }

        .login-subtitle {
            color: var(--secondary);
            font-size: 14px;
            text-align: center;
            margin-bottom: 32px;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            color: var(--secondary);
            font-size: 13px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group input {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px 16px;
            color: var(--primary);
            font-size: 15px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .form-group input::placeholder {
            color: rgba(161, 161, 161, 0.5);
        }

        .form-group input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(247, 147, 26, 0.15);
        }

        .login-error {
            color: var(--danger);
            font-size: 13px;
            text-align: center;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            border-radius: 8px;
            padding: 10px 16px;
            display: none;
        }

        .login-error.visible {
            display: block;
        }

        .login-btn {
            background: var(--gradient-primary);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-size: 15px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: opacity 0.2s ease, transform 0.2s ease;
            margin-top: 4px;
            min-height: 48px;
        }

        .login-btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .login-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: var(--secondary);
            font-size: 13px;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .back-link:hover {
            color: var(--accent);
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 36px 24px;
            }
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-brand">
            <div class="brand-icon">₿</div>
            <span class="brand-text">CryptoAnalysis</span>
        </div>

        <h1 class="login-title">Entrar na conta</h1>
        <p class="login-subtitle">Acesse a plataforma de análise de Bitcoin</p>

        <form class="login-form" id="login-form" novalidate>
            <div class="form-group">
                <label for="username">Login</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Digite seu login"
                    autocomplete="username"
                />
            </div>

            <div class="form-group">
                <label for="password">Senha</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Digite sua senha"
                    autocomplete="current-password"
                />
            </div>

            <p class="login-error" id="login-error"></p>

            <button type="submit" class="login-btn" id="login-btn">Entrar</button>
        </form>

        <a href="index.html" class="back-link">← Voltar ao dashboard</a>
    </div>

    <script>
        const form = document.getElementById('login-form');
        const errorEl = document.getElementById('login-error');
        const btn = document.getElementById('login-btn');

        function showError(msg) {
            errorEl.textContent = msg;
            errorEl.classList.add('visible');
        }

        function hideError() {
            errorEl.classList.remove('visible');
        }

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            hideError();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            if (!username || !password) {
                showError('Preencha todos os campos.');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Entrando...';

            // Simula autenticação (substituir por chamada real à API)
            setTimeout(() => {
                btn.disabled = false;
                btn.textContent = 'Entrar';
                window.location.href = 'index.html';
            }, 1000);
        });
    </script>
</body>
</html>
